<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbylTjVk6jSVJ-XCqp3ViOFURqCMSwCJujenagzzmpuVXrVoKzAS-AB0QVOhjBtV2Lm8/exec";
  function runner(ok, ng, user) {
    return new Proxy({}, { get: function (_, name) {
      if (name === 'withSuccessHandler') return function (h) { return runner(h, ng, user); };
      if (name === 'withFailureHandler') return function (h) { return runner(ok, h, user); };
      if (name === 'withUserObject') return function (o) { return runner(ok, ng, o); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        // text/plain にして、事前の確認（プリフライト）なしで GAS に届くようにする
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: name, args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j && j.ok) { if (ok) ok(j.result, user); }
            else if (ng) ng(new Error((j && j.error) || 'エラー'), user);
          })
          .catch(function (e) { if (ng) ng(e, user); });
      };
    } });
  }
  window.google = { script: { run: runner(null, null, undefined) } };
})();
</script>

html,body{background:var(--bg);color:var(--txt);font-family:"Noto Sans JP",sans-serif;min-height:100%}
body{background:radial-gradient(ellipse at top,#1b1450 0%,#07081a 60%) fixed}
button{font-family:"Dela Gothic One","Noto Sans JP",sans-serif;cursor:pointer;border:none}
#app{max-width:920px;margin:0 auto;padding:12px}
.screen{display:none}.screen.active{display:block}
.logo{font-family:"Dela Gothic One",sans-serif;text-align:center;font-size:clamp(28px,7vw,52px);letter-spacing:2px;

.buildWrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}

#pv{width:100%;aspect-ratio:1/1.05;display:block;border-radius:10px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px}
.slot.empty{visibility:hidden}
.slot label{font-size:12px;color:var(--sub);font-weight:900}
.slot input{width:100%;max-width:92px;aspect-ratio:1;text-align:center;font-size:40px;font-weight:900;font-family:"Noto Sans JP",sans-serif;

const STARS = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * .6, s: Math.random() * 1.6 + .3, p: Math.random() * 6 }));

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04050f'); g.addColorStop(.55, '#1a0f3d'); g.addColorStop(1, '#090418');

  const hg = ctx.createLinearGradient(0, Y - 40, 0, Y + 10); hg.addColorStop(0, 'rgba(255,77,210,0)'); hg.addColorStop(1, 'rgba(255,77,210,.35)');
  ctx.fillStyle = hg; ctx.fillRect(0, Y - 40, W, 50);

  const off = (t * .5) % 1;

    const k = Math.pow((i + off) / 9, 2.2), y = Y + (H - Y) * k;

      const k = easeOutBack(clamp((B.pt - 1.75) / .4));
      ctx.save(); ctx.translate(W / 2, H - 70); ctx.scale(k, k);
      txt(ctx, '合体完了!!', 0, -34, 22, '#ffd35a', { glow: '#ffd35a' });
      txt(ctx, B.p.name, 0, 8, 44, '#fff', { glow: ELEM[B.p.aura].c });
      ctx.restore();
    }
  }
  if (B.phase !== 'combine') drawHUD();
  if (B.phase === 'enter') {
    const a = clamp(B.pt / .3) * (1 - clamp((B.pt - 1.6) / .3));
    ctx.globalAlpha = a;
    if (B.e.boss && Math.sin(B.t * 10) > 0) { ctx.fillStyle = 'rgba(255,0,40,.25)'; ctx.fillRect(0, 0, W, H); }
    txt(ctx, B.e.boss ? '⚠ WARNING ⚠' : `STAGE ${run.stage}`, W / 2, H / 2 - 30, 50, B.e.boss ? '#ff3d5a' : '#fff', { glow: B.e.boss ? '#ff0030' : '#4de3ff' });
    txt(ctx, B.e.name, W / 2, H / 2 + 22, 24, '#fff', { f: FONT, w: 900 });
    ctx.globalAlpha = 1;
  }
  if (B.phase === 'fight' && B.pt < .9) txt(ctx, 'FIGHT!!', W / 2, H / 2, 64 * easeOutBack(clamp(B.pt / .3)), '#ffd35a', { glow: '#ff7a00' });
  if (B.phase === 'win' && B.pt > .5) txt(ctx, 'WIN!!', W / 2, H / 2 - 20, 70 * easeOutBack(clamp((B.pt - .5) / .3)), '#ffd35a', { glow: '#ffae00' });
  if (B.phase === 'lose' && B.pt > .6) txt(ctx, 'GAME OVER', W / 2, H / 2 - 20, 60, '#ff3d5a', { glow: '#ff0030' });
  if (B.flashS > 0) { ctx.fillStyle = `rgba(255,255,255,${B.flashS})`; ctx.fillRect(0, 0, W, H); }
}

/* ================= result & ranking ================= */
const API = {
  call(fn, arg) {
    return new Promise((res, rej) => {
      if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg);
      else res(LocalAPI[fn](arg));
    });
  }
};
const LocalAPI = { // used when opened outside GAS
  getRanking() { try { return JSON.parse(localStorage.getItem('mojirobo_rank') || '[]'); } catch (e) { return []; } },
  saveScore(d) {
    const l = this.getRanking(); l.push(Object.assign({}, d, { date: new Date().toLocaleDateString('ja-JP') }));
    l.sort((a, b) => b.stage - a.stage || a.power - b.power); const r = l.slice(0, 30);
    try { localStorage.setItem('mojirobo_rank', JSON.stringify(r)); } catch (e) { }
    return r;
  }
};
function rankTable(list) {
  if (!list || !list.length) return '<p class="hint" style="text-align:center">まだ記録がありません</p>';
  return '<table class="rk"><tr><th>#</th><th>パイロット</th><th>ロボ</th><th>到達</th></tr>' + list.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${esc(r.name)}<br><small style="color:#8d93c7">${esc(r.date || '')}</small></td><td class="c">${esc(r.chars)}<br><small style="font-size:11px;color:#8d93c7;letter-spacing:0">${esc(r.robot || '')}</small></td><td><b>STAGE ${r.stage}</b></td></tr>`).join('') + '</table>';
}
function openModal(h) { $('#mbox').innerHTML = h; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
function showResult() {
  const R = run.robot;
  let pname = ''; try { pname = localStorage.getItem('mojirobo_pilot') || ''; } catch (e) { }
  openModal(`<h2 style="color:#ff3d5a">GAME OVER</h2>
    <div class="big">STAGE ${run.stage} まで到達！（撃破 ${run.wins}体）</div>
    <p style="text-align:center;font-weight:900;font-size:26px;letter-spacing:3px">${esc(R.chars.join(''))}</p>
    <p style="text-align:center;color:#8d93c7;margin-bottom:12px">${esc(R.name)}（${R.type.n}・ランク${R.rank}）</p>
    <input id="pname" maxlength="12" placeholder="パイロット名" value="${esc(pname)}">
    <div class="row"><button id="saveBtn" class="main">ランキング登録</button></div>
    <div id="rkArea"></div>
    <div class="row"><button id="againBtn">同じロボで再挑戦</button><button id="backBtn">ロボを作り直す</button></div>`);
  $('#saveBtn').onclick = async () => {
    const name = $('#pname').value.trim() || 'ななしパイロット';
    try { localStorage.setItem('mojirobo_pilot', name); } catch (e) { }
    $('#saveBtn').disabled = true; $('#saveBtn').textContent = '送信中…';
    try {
      const list = await API.call('saveScore', { name, chars: R.chars.join(''), robot: R.name, stage: run.stage, power: R.power });
      $('#saveBtn').textContent = '登録しました！'; $('#rkArea').innerHTML = rankTable(list);
    } catch (err) { $('#saveBtn').disabled = false; $('#saveBtn').textContent = '失敗…もう一度'; }
  };
  $('#againBtn').onclick = () => { closeModal(); startRun(run.robot); };
  $('#backBtn').onclick = () => { closeModal(); B = null; $('#battle').classList.remove('active'); $('#build').classList.add('active'); };
}
async function showRanking() {
  openModal('<h2>🏆 RANKING</h2><div id="rkArea"><p class="hint" style="text-align:center">読み込み中…</p></div><div class="row"><button id="clsBtn">とじる</button></div>');
  $('#clsBtn').onclick = closeModal;
  try { $('#rkArea').innerHTML = rankTable(await API.call('getRanking')); } catch (e) { $('#rkArea').innerHTML = '<p class="hint">読み込みに失敗しました</p>'; }
}

/* ================= main loop ================= */
$('#spdBtn').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('#spdBtn').textContent = `▶ ×${speed}`; };
$('#muteBtn').onclick = () => { muted = !muted; $('#muteBtn').textContent = muted ? '🔇' : '🔊'; };
let last = performance.now(), gt = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; gt += dt;
  if (B) {
    const steps = speed; for (let i = 0; i < steps; i++) updBattle(dt);
    drawBattle();
  } else drawPreview(gt);
  requestAnimationFrame(loop);
}
setupBuild();
fontReady(RANDOM_POOL + ENEMY_POOL + curChars().join('')).then(() => { GM.clear(); onChars(); });
requestAnimationFrame(loop);
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
